<!DOCTYPE html?>
<head>
  <title>Article Archive</title>  
  <meta chartset = "UTF-8">
  <meta name = "viewport" content = "width=device-width, initial-scale=1.0">
<script scr="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  .chart-container{
    width:90%;
    max-width:800px;
    margin:30px auto;
  }
</style>
</head>
<body>
  <h1 style="text-align:center,"> My Article Archive</h1>
  <p style="text-align:center,">Here is a sample of what I've written</p>
<div style="text-align:center," class="image">
  <img src = "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTHY3YOKEe6WnzmegAIz2XlbelVulaFglhjVYvOQKAHZg&s=10">
</div>
<div class = "chart-container">
  <canvas id = chart></canvas>
</div>
<script>
  const ctx=document.getElementBYId("chart");
  new Chart(ctx,{
    type: "line",
    data: {
      labels:["Monday", "Tuesday" , "Wednesday" , "Thursday" , "Friday"],
      datasets:[{
        label: "Coffee Spending",
        data:[6.00,12.00,12.00,18.00,18.00],
        borderColor:"green",
        backgroundColor:"white",
        borderWidth:3,
        fill:true,
        tension:0.35,
        pointRadius:4,
        pointBackgroundColor:"green"
      }]
    },
    options:{
      responsive:true,
      maintainAspectRatio:true,

    plugins:{
      legend:{
        display:true
      }
    },
    Scales:{
      y:{
        beginAtZero:true
      }
    }
  }
});
</script>  
</body>
</html>
